<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NSE BSE TRACKER V4</title><style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0f14;
    color: #e8edf3;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 16px;
}

/* HEADER */

.header {
    text-align: center;
    padding: 14px 8px 18px;
}

.header h1 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.5px;
}

.header p {
    color: #8d98a5;
    font-size: 12px;
    margin-top: 5px;
}

/* SEARCH */

.search-section {
    background: #111720;
    border: 1px solid #202a35;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
}

.search-row {
    display: flex;
    gap: 8px;
}

.search-input {
    flex: 1;
    min-width: 0;
    background: #0b0f14;

    border: 1px solid #2a3542;

    padding: 12px;

}

.search-input:focus {
    border-color: #526273;
}

.search-button {
    background: #1d2732;
    color: #fff;
    border: 1px solid #354250;
    border-radius: 10px;
    padding: 0 17px;
    font-size: 14px;
    cursor: pointer;
}

.search-button:active {
    transform: scale(0.98);
}

.exchange-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.exchange-btn {
    flex: 1;
    background: #0b0f14;

    border: 1px solid #2a3542;

}

.exchange-btn.active {
    background: #202b37;

    border-color: #536273;
}

/* SEARCH RESULTS */

.search-results {
    margin-top: 10px;
    display: none;
    max-height: 260px;
    overflow-y: auto;
}

.search-result-item {
    padding: 11px;
    border-bottom: 1px solid #202a35;
    cursor: pointer;
}

.search-result-item:last-child {
    border-bottom: none;
}

.search-result-item:hover {
    background: #18212b;
}

.result-symbol {
    font-size: 14px;
    font-weight: 700;
}

.result-company {
    font-size: 12px;
    color: #8995a2;
    margin-top: 3px;
}

/* INDEX CARDS */

.index-section {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 14px;
}

.index-card {
    background: #111720;
    border: 1px solid #202a35;
    border-radius: 13px;
    padding: 14px;
}

.index-name {
    font-size: 13px;
    color: #9aa5b1;
    margin-bottom: 7px;
}

.index-price {
    font-size: 21px;
    font-weight: 700;
}

.index-change {
    font-size: 13px;
    margin-top: 5px;
}

.up {
    color: #35c978;
}

.down {
    color: #ff5f5f;
}

.neutral {
    color: #aab4bf;
}

/* STOCK PANEL */

.stock-panel {
    display: none;
    background: #111720;
    border: 1px solid #202a35;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 14px;
}

.stock-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
}

.stock-title {
    min-width: 0;
}

.stock-symbol {
    font-size: 21px;

}

.stock-company {

    color: #8e99a6;

}

.exchange-badge {

.price-area {
    margin-top: 17px;
}

.current-price {
    font-size: 30px;
    font-weight: 700;
}

.price-change {
    font-size: 14px;
    margin-top: 5px;
}

.stock-info-grid {

    grid-template-columns: repeat(2, 1fr);

    margin-top: 17px;
}

.info-box {
    background: #0b0f14;
    border: 1px solid #1f2933;
    border-radius: 9px;
    padding: 10px;
}

.info-label {

    font-size: 11px;
}

.info-value {
    font-size: 13px;

    font-weight: 600;

/* CHART */

.chart-section {
    display: none;
    background: #111720;
    border: 1px solid #202a35;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 14px;
}

.section-title {

.period-buttons {

#priceChart {

.history-table {

.history-table th:not(:first-child),

    text-align: right;
}

.history-up {
    color: #35c978;

}

.history-down {
    color: #ff5f5f;

}

.history-neutral {
    color: #aab4bf;
}
/* QUICK LINKS */

.quick-links {
    display: none;
    background: #111720;

.links-grid {

.quick-link {

.quick-link:hover {

/* NEWS */

.news-section {

.news-label {

.news-item {

.news-item:last-child {

}

.news-title {

.news-meta {

/* STATUS / LOADING */

.status-message {

/* FOOTER */

.footer {

/* MOBILE */

@media (max-width: 600px) {

    .container {
        padding: 10px;
    }

    .header h1 {

    }

    .current-price {

    }

    .chart-container {

    }
}

@media (min-width: 700px) {

    .stock-info-grid {
        grid-template-columns: repeat(4, 1fr);
    }

    .links-grid {
        grid-template-columns: repeat(4, 1fr);
    }
}

</div><!-- Chart library --><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script>
/* =========================================================
   NSE BSE TRACKER V4
   JAVASCRIPT — PART 1
   ========================================================= */

/* Cloudflare Worker */
const API_BASE =
    "https://nse-bse-tracker-v4.vasimbhaipainter.workers.dev";

/* Current state */
let selectedExchange = "NSE";
let selectedSymbol = "";
let selectedCompany = "";
let priceChart = null;


/* ---------------------------------------------------------
   ELEMENT HELPERS
--------------------------------------------------------- */

function $(id) {
    return document.getElementById(id);
}


/* ---------------------------------------------------------
   EXCHANGE SELECTOR
--------------------------------------------------------- */

function setExchange(exchange) {

    selectedExchange = exchange;

    $("nseBtn").classList.remove("active");
    $("bseBtn").classList.remove("active");

    if (exchange === "NSE") {
        $("nseBtn").classList.add("active");
    } else {
        $("bseBtn").classList.add("active");
    }

    const query = $("searchInput").value.trim();

    if (query.length >= 2) {
        searchStocks(query);
    }
}


/* ---------------------------------------------------------
   STATUS
--------------------------------------------------------- */

function showStatus(message, isError = false) {

    const box = $("statusMessage");

    box.textContent = message;
    box.className = "status-message";

    if (isError) {
        box.classList.add("error-message");
    }

    box.style.display = "block";
}


function hideStatus() {
    $("statusMessage").style.display = "none";
}


/* ---------------------------------------------------------
   NUMBER FORMAT
--------------------------------------------------------- */

function formatNumber(value, decimals = 2) {

    if (
        value === null ||
        value === undefined ||
        value === "" ||
        Number.isNaN(Number(value))
    ) {
        return "--";
    }

    return Number(value).toLocaleString("en-IN", {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
    });
}


/* ---------------------------------------------------------
   PRICE CHANGE CLASS
--------------------------------------------------------- */

function changeClass(value) {

    const number = Number(value);

    if (number > 0) {
        return "up";
    }

    if (number < 0) {
        return "down";
    }

    return "neutral";
}


/* ---------------------------------------------------------
   SEARCH BUTTON
--------------------------------------------------------- */

$("searchButton").addEventListener("click", function () {

    const query = $("searchInput").value.trim();

    if (!query) {
        showStatus("Please enter a stock symbol or company name.", true);
        return;
    }

    searchStocks(query);
});


/* ---------------------------------------------------------
   ENTER KEY SEARCH
--------------------------------------------------------- */

$("searchInput").addEventListener("keydown", function (event) {

    if (event.key === "Enter") {

        const query = $("searchInput").value.trim();

        if (query) {
            searchStocks(query);
        }
    }
});


/* ---------------------------------------------------------
   SEARCH API
--------------------------------------------------------- */

async function searchStocks(query) {

    try {

        hideStatus();

        $("searchResults").style.display = "block";

        $("searchResults").innerHTML =
            '<div class="search-result-item">Searching...</div>';

        const url =
            API_BASE +
            "/search?q=" +
            encodeURIComponent(query) +
            "&exchange=" +
            encodeURIComponent(selectedExchange);

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("Search request failed");
        }

        const data = await response.json();

        renderSearchResults(data);

    } catch (error) {

        console.error(error);

        $("searchResults").innerHTML =
            '<div class="search-result-item">Unable to search right now.</div>';
    }
}


/* ---------------------------------------------------------
   SEARCH RESULTS RENDER
--------------------------------------------------------- */

function renderSearchResults(data) {

    const box = $("searchResults");

    let results = [];

    if (Array.isArray(data)) {
        results = data;
    } else if (Array.isArray(data.results)) {
        results = data.results;
    } else if (Array.isArray(data.data)) {
        results = data.data;
    }

    if (results.length === 0) {

        box.innerHTML =
            '<div class="search-result-item">No matching stock found.</div>';

        return;
    }

    box.innerHTML = "";

    results.forEach(function (item) {

        const symbol =
            item.symbol ||
            item.tradingsymbol ||
            item.code ||
            item.scrip_code ||
            "";

        const company =
            item.company ||
            item.company_name ||
            item.name ||
            item.companyName ||
            "";

        const div = document.createElement("div");

        div.className = "search-result-item";

        div.innerHTML = `
            <div class="result-symbol">${escapeHtml(symbol)}</div>
            <div class="result-company">${escapeHtml(company)}</div>
        `;

        div.addEventListener("click", function () {

            selectedSymbol = symbol;
            selectedCompany = company;

            $("searchInput").value = symbol;
            box.style.display = "none";

            loadStock(symbol, selectedExchange);
        });

        box.appendChild(div);
    });
}


/* ---------------------------------------------------------
   HTML ESCAPE
--------------------------------------------------------- */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ---------------------------------------------------------
   LOAD STOCK
--------------------------------------------------------- */

async function loadStock(symbol, exchange) {

    try {

        showStatus("Loading stock data...");

        const url =
            API_BASE +
            "/stock?symbol=" +
            encodeURIComponent(symbol) +
            "&exchange=" +
            encodeURIComponent(exchange);

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("Stock request failed");
        }

        const data = await response.json();

        renderStock(data, symbol, exchange);

        hideStatus();

        $("chartSection").style.display = "block";
        $("quickLinks").style.display = "block";
        $("newsSection").style.display = "block";

        loadHistory("7d");
        loadNews(symbol, exchange);

    } catch (error) {

        console.error(error);

        showStatus(
            "Unable to load stock data. Please try again.",
            true
        );
    }
}


/* ---------------------------------------------------------
   RENDER STOCK
--------------------------------------------------------- */

function renderStock(data, symbol, exchange) {

    const stock = data.stock || {};
    const market = data.market || {};

    const price = market.price;

    const previousClose = market.previous_close;

    const change = market.change;

    $("stockPanel").style.display = "block";

    $("stockSymbol").textContent =
        stock.symbol || symbol;

    $("stockCompany").textContent =
        stock.company_name || "";

    $("exchangeBadge").textContent =
        exchange;

    $("currentPrice").className =
    "current-price " + changeClass(change);

$("currentPrice").textContent =
    formatNumber(price);

    $("previousClose").textContent =
        formatNumber(previousClose);

    $("weekHigh").className =
    "info-value up";

$("weekHigh").textContent =
    formatNumber(
        market.fifty_two_week_high
    );

$("weekLow").className =
    "info-value down";

$("weekLow").textContent =
    formatNumber(
        market.fifty_two_week_low
    );

    $("tradingStatus").textContent =
        stock.trading_status || "--";

    const changeElement =
        $("priceChange");

    changeElement.className =
        "price-change " + changeClass(change);

    if (change !== null && change !== undefined) {

        const sign =
            Number(change) > 0 ? "+" : "";

        changeElement.textContent =
            sign + formatNumber(change);

    } else {

        changeElement.textContent = "--";
    }

    updateQuickLinks(
        stock.symbol || symbol,
        exchange
    );
}
/* ---------------------------------------------------------
QUICK LINKS
--------------------------------------------------------- */

function updateQuickLinks(symbol, exchange) {

let yahooSymbol = symbol;

if (exchange === "NSE") {
    yahooSymbol = symbol + ".NS";
}

if (exchange === "BSE") {
    yahooSymbol = symbol + ".BO";
}

$("yahooLink").href =
    "https://finance.yahoo.com/quote/" +
    encodeURIComponent(yahooSymbol);

$("googleLink").href =
    "https://www.google.com/finance/quote/" +
    encodeURIComponent(symbol) +
    ":" +
    encodeURIComponent(exchange);

$("screenerLink").href =
    "https://www.screener.in/company/" +
    encodeURIComponent(symbol) +
    "/";

$("nseLink").href =
    "https://www.nseindia.com/get-quotes/equity?symbol=" +
    encodeURIComponent(symbol);

}
/* ---------------------------------------------------------
LOAD HISTORY
--------------------------------------------------------- */

async function loadHistory(period = "7d") {

if (!selectedSymbol) {
    return;
}

try {

    document
        .querySelectorAll(".period-btn")
        .forEach(function (button) {

            button.classList.remove("active");

            if (button.dataset.period === period) {
                button.classList.add("active");
            }
        });

    const url =
        API_BASE +
        "/history?symbol=" +
        encodeURIComponent(selectedSymbol) +
        "&exchange=" +
        encodeURIComponent(selectedExchange) +
        "&period=" +
        encodeURIComponent(period);

    const response = await fetch(url);

    if (!response.ok) {
        throw new Error("History request failed");
    }

    const data = await response.json();

    renderHistory(data);

} catch (error) {

    console.error(error);

    const canvas = $("priceChart");

    if (priceChart) {
        priceChart.destroy();
        priceChart = null;
    }

    const ctx = canvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );
}

}

/* ---------------------------------------------------------
RENDER HISTORY
--------------------------------------------------------- */

function renderHistory(data) {

    let history = [];

    if (Array.isArray(data)) {
        history = data;
    } else if (Array.isArray(data.history)) {
        history = data.history;
    } else if (Array.isArray(data.data)) {
        history = data.data;
    } else if (Array.isArray(data.results)) {
        history = data.results;
    }

    if (history.length === 0) {
        return;
    }

    // CHART: oldest → newest
    const chartHistory = [...history].sort(function (a, b) {
        return Number(a.timestamp || 0) - Number(b.timestamp || 0);
    });

    const labels = [];
    const prices = [];

    chartHistory.forEach(function (item) {

        const date =
            item.date ||
            item.datetime ||
            item.timestamp ||
            item.time;

        const price =
            item.close ??
            item.price ??
            item.close_price ??
            item.last_price;

        if (
            date !== undefined &&
            price !== undefined &&
            price !== null
        ) {
            labels.push(formatChartDate(date));
            prices.push(Number(price));
        }
    });

    if (prices.length > 0) {
        drawChart(labels, prices);
    }

    // TABLE: newest → oldest
    const tableHistory = [...history].sort(function (a, b) {
        return Number(b.timestamp || 0) - Number(a.timestamp || 0);
    });

    const tableBody = document.getElementById("historyTableBody");

    if (!tableBody) {
        return;
    }

    let html = "";

    tableHistory.forEach(function (item, index) {

        const date =
            item.date ||
            item.datetime ||
            item.timestamp ||
            item.time;

        const price = Number(
            item.close ??
            item.price ??
            item.close_price ??
            item.last_price
        );

        if (
            date === undefined ||
            isNaN(price)
        ) {
            return;
        }

        // Next item = previous trading day
        const previousItem = tableHistory[index + 1];

        let change = null;
        let changePercent = null;

        if (previousItem) {

            const previousPrice = Number(
                previousItem.close ??
                previousItem.price ??
                previousItem.close_price ??
                previousItem.last_price
            );

            if (!isNaN(previousPrice) && previousPrice !== 0) {

                change = price - previousPrice;

                changePercent =
                    (change / previousPrice) * 100;
            }
        }

        let changeText = "-";
        let percentText = "-";
        let changeClass = "history-neutral";

        if (change !== null) {

            const changeSign =
                change > 0 ? "+" : "";

            changeText =
                changeSign + formatNumber(change);

            percentText =
                changeSign +
                changePercent.toFixed(2) +
                "%";

            if (change > 0) {
                changeClass = "history-up";
            } else if (change < 0) {
                changeClass = "history-down";
            }
        }

        html += `
            <tr>
                <td>${formatChartDate(date)}</td>
                <td class="${changeClass}">${formatNumber(price)}</td>
                <td class="${changeClass}">${changeText}</td>
                <td class="${changeClass}">${percentText}</td>
            </tr>
        `;
    });

    tableBody.innerHTML = html;
}
/* ---------------------------------------------------------
CHART DATE FORMAT
--------------------------------------------------------- */

function formatChartDate(value) {

if (!value) {
    return "";
}

const date = new Date(value);

if (Number.isNaN(date.getTime())) {
    return String(value);
}

return date.toLocaleDateString("en-IN", {
    day: "2-digit",
    month: "short"
});

}

/* ---------------------------------------------------------
DRAW PRICE CHART
--------------------------------------------------------- */

function drawChart(labels, prices) {

const canvas = $("priceChart");

if (priceChart) {
    priceChart.destroy();
}

const ctx = canvas.getContext("2d");

priceChart = new Chart(ctx, {

    type: "line",

    data: {
        labels: labels,

        datasets: [{
            label: selectedSymbol,
            data: prices,

            borderWidth: 2,

            pointRadius: 2,

            pointHoverRadius: 5,

            tension: 0.25,

            fill: false
        }]
    },

    options: {

        responsive: true,

        maintainAspectRatio: false,

        interaction: {
            mode: "index",
            intersect: false
        },

        plugins: {

            legend: {
                display: false
            },

            tooltip: {

                callbacks: {

                    label: function (context) {

                        return "₹ " +
                            formatNumber(
                                context.parsed.y
                            );
                    }
                }
            }
        },

        scales: {

            x: {

                ticks: {
                    color: "#8995a2",
                    maxTicksLimit: 7,
                    font: {
                        size: 10
                    }
                },

                grid: {
                    display: false
                }
            },

            y: {

                ticks: {

                    color: "#8995a2",

                    font: {
                        size: 10
                    },

                    callback: function (value) {
                        return "₹ " +
                            Number(value).toLocaleString(
                                "en-IN"
                            );
                    }
                },

                grid: {
                    color: "#202a35"
                }
            }
        }
    }
});

}

LOAD NEWS
--------------------------------------------------------- */

async function loadNews(symbol, exchange) {

const newsSection = $("newsSection");
const newsList = $("newsList");

newsSection.style.display = "block";

newsList.innerHTML =
    '<div class="news-item">' +
    '<div class="news-meta">Loading news...</div>' +
    '</div>';

try {

    const url =
        API_BASE +
        "/news?symbol=" +
        encodeURIComponent(symbol) +
        "&exchange=" +
        encodeURIComponent(exchange);

    const response = await fetch(url);

    if (!response.ok) {
        throw new Error("News request failed");
    }

    const data = await response.json();

    renderNews(data);

} catch (error) {

    console.error(error);

    newsList.innerHTML =
        '<div class="news-item">' +
        '<div class="news-meta">' +
        'News unavailable right now.' +
        '</div>' +
        '</div>';
}

}

/* ---------------------------------------------------------
RENDER NEWS
--------------------------------------------------------- */

function renderNews(data) {

const newsList = $("newsList");

let news = [];

if (Array.isArray(data)) {
    news = data;
} else if (Array.isArray(data.news)) {
    news = data.news;
} else if (Array.isArray(data.data)) {
    news = data.data;
} else if (Array.isArray(data.results)) {
    news = data.results;
}

if (news.length === 0) {

    newsList.innerHTML =
        '<div class="news-item">' +
        '<div class="news-meta">' +
        'No news found for the last 15 days.' +
        '</div>' +
        '</div>';

    return;
}

newsList.innerHTML = "";

news.forEach(function (item) {

    const title =
        item.title ||
        item.headline ||
        "";

    const source =
        item.source ||
        item.publisher ||
        "";

    const link =
        item.link ||
        item.url ||
        "#";

    const date =
        item.date ||
        item.published_at ||
        item.published ||
        "";

    const article = document.createElement("div");

    article.className = "news-item";

    article.innerHTML = `
        <a
            class="news-title"
            href="${escapeHtml(link)}"
            target="_blank"
            rel="noopener"
        >
            ${escapeHtml(title)}
        </a>

        <div class="news-meta">
            ${escapeHtml(source)}
            ${date ? " • " + escapeHtml(formatNewsDate(date)) : ""}
        </div>
    `;

    newsList.appendChild(article);
});

}

if (!value) {

}

if (Number.isNaN(date.getTime())) {
    return String(value);
}

return date.toLocaleDateString("en-IN", {

});

  /* ---------------------------------------------------------
LOAD NIFTY 50 AND SENSEX
--------------------------------------------------------- */

async function loadMarketIndices() {

try {

    const niftyUrl =
        API_BASE +
        "/stock?symbol=NIFTY&exchange=NSE";

    const sensexUrl =
        API_BASE +
        "/stock?symbol=SENSEX&exchange=BSE";

    const results = await Promise.allSettled([

        fetch(niftyUrl),
        fetch(sensexUrl)

    ]);

    /* NIFTY */

    if (
        results[0].status === "fulfilled" &&
        results[0].value.ok
    ) {

        const niftyData =
            await results[0].value.json();

        renderIndex(
            niftyData,
            "niftyPrice",
            "niftyChange"
        );
    }

    /* SENSEX */

    if (
        results[1].status === "fulfilled" &&
        results[1].value.ok
    ) {

        const sensexData =
            await results[1].value.json();

        renderIndex(
            sensexData,
            "sensexPrice",
            "sensexChange"
        );
    }

} catch (error) {

    console.error(
        "Index loading error:",
        error
    );
}

}

/* ---------------------------------------------------------
RENDER INDEX
--------------------------------------------------------- */

function renderIndex(
    data,
    priceElementId,
    changeElementId
) {

    const stock = data.stock || {};
    const market = data.market || {};

    const price =
        market.price;

    const change =
        market.change;

    const priceElement =
        $(priceElementId);

    priceElement.className =
        "index-price " +
        changeClass(change);

    priceElement.textContent =
        formatNumber(price);

    const changeElement =
        $(changeElementId);

    changeElement.className =
        "index-change " +
        changeClass(change);

    if (
        change !== null &&
        change !== undefined
    ) {

        const sign =
            Number(change) > 0
                ? "+"
                : "";

        changeElement.textContent =
            sign +
            formatNumber(change);

    } else {

        changeElement.textContent =
            "--";
    }

}
